<body style="font:16px -apple-system,sans-serif;padding:24px">
<p><a href="https://app.koracarenepal.com/">app.koracarenepal.com</a></p>
<script>
  // 2026-10-11 Jun "옛 주소는 아예 없애": the old app is gone from this address. The new sw.js deletes the old offline copy and unregisters;
  // this page asks any old registration to update (so it picks up that sw.js), then goes to the new address at once.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.update().catch(() => {})));
  location.replace('https://app.koracarenepal.com/');
</script>
</body>
